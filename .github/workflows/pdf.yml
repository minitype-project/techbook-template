name: Build article PDFs

on:
  pull_request:
    paths:
      - "articles/**"
  workflow_dispatch:
    inputs:
      names:
        description: "ビルドする記事のディレクトリ名（空白区切り）．空白の場合は変更があった記事をビルドする．"
        required: false
        default: ""

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Resolve target articles
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input='${{ github.event.inputs.names }}'
            if [ -n "$input" ]; then
              names=$(printf '%s\n' $input | sort -u)
            else
              git fetch --no-tags --depth=1 origin main
              base=$(git merge-base origin/main HEAD || git rev-parse origin/main)
              names=$(git diff --name-only "$base" HEAD \
                | awk -F/ '$1 == "articles" && NF >= 2 { print $2 }' \
                | sort -u)
            fi
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            names=$(git diff --name-only "$base" "$head" \
              | awk -F/ '$1 == "articles" && NF >= 2 { print $2 }' \
              | sort -u)
          fi
          echo "names<<EOF" >> "$GITHUB_OUTPUT"
          echo "$names" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Target articles:"
          echo "$names"

      - name: Skip if no articles changed
        if: steps.changed.outputs.names == ''
        run: echo "No article changes; nothing to build." && exit 0

      - name: Install dependencies
        if: steps.changed.outputs.names != ''
        run: yarn install --frozen-lockfile

      - name: Build PDFs
        if: steps.changed.outputs.names != ''
        run: |
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ -f "articles/$name/index.mdx" ] || { echo "skip: $name (no index.mdx)"; continue; }
            echo "::group::Build $name"
            yarn build "$name"
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.names }}"

      - name: Upload PDFs
        if: steps.changed.outputs.names != ''
        uses: actions/upload-artifact@v4
        with:
          name: article-pdfs-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}
          path: dist/*.pdf
          if-no-files-found: warn
